name: Frontend CI
run-name: ${{github.event.head_commit.messages}}
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
jobs:
  lint-typecheck-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint (Biome)
        run: npx biome check .
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          # Dummy value so build doesn't fail if the code reads this at build time.
          # Real value is injected by the deploy platform (e.g. Vercel) at runtime/build.
          NEXT_PUBLIC_BE_URL: ${{ secrets.NEXT_PUBLIC_BE_URL || 'http://localhost:3000' }}
